[package]
name = "aegis-rs"
version = "0.2.0"
edition = "2021"
description = "High-performance, zero-telemetry AI Agent Security Proxy & Guardrail Engine"
license = "Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"

